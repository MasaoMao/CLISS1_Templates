<body>
    <script>
        let num1 = parseInt(prompt("Enter the first number:"));
let num2 = parseInt(prompt("Enter the second number:")); 
let num3 = parseInt(prompt("Enter the third number:"));
alert("The largest number is: " + Math.max(num1, num2, num3))
alert("numbers in ascending order: " + [num1, num2, num3].sort((a, b) => a - b));
let average = (num1 + num2 + num3) / 3;
if (average >=30){
    alert("The average is sufficient")
}
else {
    alert("The average is insufficient")
}
    </script>
