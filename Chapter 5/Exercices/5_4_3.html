<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <script>
        let question= prompt("chose an item by typing its name:\n 1: SSD 1TB \n 2: HDD 2TB \n 3: Xbox One X 1TB \n 4: iPhone 12 64GB \n 5: HDMI Cable")
        if (question == "SSD 1TB"){
            alert("The price of the SSD 1TB is: 140 euros")
        }
        else if (question == "HDD 2TB"){
            alert("The price of the HDD 2TB is: 54 euros")
        }
        else if (question == "Xbox One X 1TB"){
            alert("The price of the Xbox One X 1TB is: 475 euros")
        }
        else if (question == "iPhone 12 64GB"){
            alert("The price of the iPhone 12 64GB is: 868 euros")
        }
        else if (question == "HDMI Cable"){
            alert("The price of the HDMI Cable is: 6.93 euros")
        }
        else {
            alert("Item not found")
        }
    </script>
</body>
</html>
