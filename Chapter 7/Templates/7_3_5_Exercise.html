<!DOCTYPE html>
</html lang=en>
    <head>
    <title>Exercise 7.3.5 Calculator </title>
    <meta charset="UTF-8">
    </head>
    <body>
        <h1>Calculator</h1>
        <form>
            1st Number : <input type="number" id="firstNumber" /><br>
            2nd Number: <input type="number" id="secondNumber" /><br>
            <input type="button" onClick="calculate()" Value="Calculate" />
            </form>
            <p>The result is : <br>
            <span id = "result"></span>
            </p>
        <script>
           //start coding here
           function calculate(){
               const mInput = prompt('Enter the base number (m):', '2');
               if (mInput === null) return; 
               const nInput = prompt('Enter the exponent (integer n):', '3');
               if (nInput === null) return; 

               const m = parseFloat(mInput);
               const n = parseInt(nInput, 10);

               if (Number.isNaN(m) || Number.isNaN(n)){
                   alert('Please enter valid numbers (exponent must be an integer).');
                   return;
               }

               let result = 1;

               if (n === 0){
                   result = 1; 
               } else if (n > 0){
                   for (let i = 0; i < n; i++){
                       result *= m;
                   }
               } else { 
                   const absN = Math.abs(n);
                   for (let i = 0; i < absN; i++){
                       result *= m;
                   }
                   result = 1 / result; 
               }

               const display = Number.isFinite(result) ? result : 'Infinity';

               document.getElementById('result').textContent = display;
               alert('Result: ' + display);
               console.log(m + '^' + n + ' = ' + display);
           }
        </script>
    </body>
</html>
